[project]
name = "octopus-tickets-sorter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography<47",  # 47+ ships no macOS x86_64 wheel; would need a Rust toolchain to build

    "google-api-python-client>=2.198.0",
    "google-auth-httplib2>=0.4.1",
    "google-auth-oauthlib>=1.4.0",
    "pypdf>=6.15.0",
]

[project.scripts]
octopus-tickets-sorter = "octopus_tickets_sorter:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
